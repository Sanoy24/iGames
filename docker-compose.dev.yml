# Development infrastructure only
# Starts MongoDB + Redis. Run backend/frontend natively with npm.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down

version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: igames-mongo-dev
    ports:
      - "27018:27018"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:\"127.0.0.1:27018\"}]}).ok || rs.status().ok" | mongo --port 27018 --quiet) -eq 1
      interval: 10s
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: igames-redis-dev
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  mongodb_dev_data:
