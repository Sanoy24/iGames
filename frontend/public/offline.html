<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>iGames</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #08090d;
    color: #f4f4f5;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.25);
  }
  .icon svg { width: 34px; height: 34px; }
  h1 { font-size: 20px; font-weight: 800; margin: 0; line-height: 1.3; }
  p { font-size: 14px; color: #a1a1aa; margin: 0; line-height: 1.5; }
  button {
    margin-top: 6px;
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #f59e0b, #facc15);
    color: #08090d;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 9a15.5 15.5 0 0 1 22 0M5 13a10.5 10.5 0 0 1 14 0M8.5 17a5.5 5.5 0 0 1 7 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>Please check your internet connection</h1>
    <p>iGames couldn't connect to the network. Once you're back online, tap retry to continue.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
